name: NodeJS with Yarn

on:
  push:
    branches:
      - "master"
      - "develop"
  pull_request:
    branches:
      - "master"
      - "develop"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install yarn
      run: npm install -g yarn
    - name: Install deps
      # --ignore-engines: this dependency set has no single Node version that satisfies
      # every package's declared engines range (e.g. @zxing/library requires >=24, while
      # eslint-plugin-jsdoc caps out at 18) -- these are advisory/inaccurate for how the
      # packages are actually used here (zxing runs in the browser via webpack, jsdoc is
      # build-time only), verified locally on Node 24.
      run: yarn install --ignore-engines
    - name: Build
      run: yarn run build
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: |
          dist
